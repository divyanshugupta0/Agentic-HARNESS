<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agentic Harness — Fallback</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #0a0d14;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    .card {
      background-color: #0f1420;
      border: 1px solid #28334a;
      border-radius: 12px;
      padding: 32px 40px;
      max-width: 480px;
    }
    h2 { margin: 0 0 12px 0; color: #38bdf8; font-size: 20px; }
    p { margin: 0 0 20px 0; color: #94a3b8; font-size: 14px; line-height: 1.5; }
    code {
      background: #161c2d;
      padding: 6px 12px;
      border-radius: 6px;
      color: #a855f7;
      font-family: monospace;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Agentic Harness</h2>
    <p>The modern Vite React frontend bundle was not found. Please compile the frontend by executing:</p>
    <code>npm run frontend:build</code>
  </div>
</body>
</html>
