<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Agentic Harness — Live PiP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f19;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 12px;
      overflow: hidden;
      user-select: none;
    }
    .pip-header {
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .pip-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      overflow: hidden;
    }
    .pip-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      flex-shrink: 0;
      animation: pulse 1.3s ease-in-out infinite;
    }
    .pip-dot--idle {
      background: #10b981;
      box-shadow: none;
      animation: none;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .pip-actions {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pip-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .pip-btn:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }
    .pip-btn--danger {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .pip-btn--danger:hover { background: rgba(239, 68, 68, 0.35); color: #fff; }
    .pip-body {
      flex: 1;
      padding: 10px 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12.5px;
      line-height: 1.45;
      color: #cbd5e1;
    }
    .pip-status {
      font-size: 11px;
      font-weight: 600;
      color: #38bdf8;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .pip-preview {
      white-space: pre-wrap;
      word-break: break-word;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="pip-header">
    <div class="pip-title">
      <span id="dot" class="pip-dot"></span>
      <span id="model-name">Agentic Harness</span>
    </div>
    <div class="pip-actions">
      <button id="stop-btn" class="pip-btn pip-btn--danger" title="Stop agent">Stop</button>
      <button id="open-btn" class="pip-btn" title="Return to main window">Open</button>
      <button id="close-btn" class="pip-btn" title="Hide PiP">×</button>
    </div>
  </div>
  <div class="pip-body">
    <div id="status-line" class="pip-status">Running...</div>
    <div id="preview-text" class="pip-preview">Waiting for model output...</div>
  </div>
  <script>
    const dotEl = document.getElementById('dot');
    const modelEl = document.getElementById('model-name');
    const statusEl = document.getElementById('status-line');
    const previewEl = document.getElementById('preview-text');
    const stopBtn = document.getElementById('stop-btn');

    if (window.api?.onMessage) {
      window.api.onMessage('pip:state', (state) => {
        if (!state) return;
        modelEl.textContent = state.model || 'Agentic Harness';
        statusEl.textContent = state.statusText || (state.running ? 'Running...' : 'Completed');
        previewEl.textContent = state.previewText || 'Working...';
        dotEl.className = state.running ? 'pip-dot' : 'pip-dot pip-dot--idle';
        stopBtn.style.display = state.running ? 'inline-block' : 'none';
      });
    }

    stopBtn.addEventListener('click', () => window.api?.sendMessage('pip:action', { action: 'stop' }));
    document.getElementById('open-btn').addEventListener('click', () => window.api?.sendMessage('pip:action', { action: 'focus-main' }));
    document.getElementById('close-btn').addEventListener('click', () => window.api?.sendMessage('pip:action', { action: 'close' }));
  </script>
</body>
</html>
